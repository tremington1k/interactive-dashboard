<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dashboard</title>
    <!-- Bootstrap first so the custom CSS can override it when needed -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h1>
        My Interactive Dashboard
    </h1>
    <p>
        This dashboard was created by Taylor Remington for the WEB-115 course at Wake Tech
    </p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
            <div class="col" id="weekly-tasks"> <!-- M4 Assignment: Weekly Goal Function -->
                <form>
                    <label>Name:</label>
                    <input type="text" id="user-name">
                    <label>Daily Task Goal:</label>
                    <input type="number" id="daily-goal">
                    <label>Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks">
                    <button id="goal-btn">Submit</button>
                </form>
                <p id="goal-message"></p>
                <script src="js/task-manager.js"></script>
            </div>
            <div class="col" id="metric-converter">
                <form>
                    <label>Enter a value to be converted: </label>
                    <input type="number" id="user-value">
                    <label>Choose a conversion type:</label>
                    <select id="conversion-type">
                        <option value="in-cm">Inches to Centimeters</option>
                        <option value="ft-cm">Feet to Centimeters</option>
                        <option value="yd-m">Yards to Meters</option>
                        <option value="mi-km">Miles to Kilometers</option>
                        <option value="cm-in">Centimeters to Inches</option>
                        <option value="cm-ft">Centimeters to Feet</option>
                        <option value="m-yd">Meters to Yards</option>
                        <option value="km-mi">Kilometers to Miles</option>
                    </select>
                    <button id="convert-btn">Convert</button>
                </form>
                <p id="conversion-result"></p>
                <script src="js/metric-converter.js"></script>
            </div>
        </div>
    </div>
</body>
</html>
